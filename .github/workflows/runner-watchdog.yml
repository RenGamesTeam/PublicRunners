name: Runner Watchdog

# Restarts a runner chain that died without handing over (crashed runner,
# expired token, deleted run, ...). A chain cannot recover from its own death,
# so this workflow is the external supervisor.
#
# Safety rails (see src/common/watchdog.sh):
#   * never starts a workflow that already has a queued/in-progress run,
#   * respects a recent cancellation for 24h,
#   * stops restarting after 5 consecutive failed runs,
#   * never restarts a chain whose last run is older than 12h.
#
# Configure via repository variables:
#   RUNNER_CHAIN_ENABLED              "false" disables runners and watchdog.
#   WATCHDOG_WORKFLOWS                default "runner-ubuntu.yml"
#   WATCHDOG_MAX_IDLE_HOURS           default 12
#   WATCHDOG_MAX_CONSECUTIVE_FAILURES default 5
#   WATCHDOG_CANCEL_COOLDOWN_HOURS    default 24
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: public-runner-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHAIN_ENABLED: ${{ vars.RUNNER_CHAIN_ENABLED || 'true' }}
      WATCHDOG_WORKFLOWS: ${{ vars.WATCHDOG_WORKFLOWS || 'runner-ubuntu.yml' }}
      WATCHDOG_MAX_IDLE_HOURS: ${{ vars.WATCHDOG_MAX_IDLE_HOURS || '12' }}
      WATCHDOG_MAX_CONSECUTIVE_FAILURES: ${{ vars.WATCHDOG_MAX_CONSECUTIVE_FAILURES || '5' }}
      WATCHDOG_CANCEL_COOLDOWN_HOURS: ${{ vars.WATCHDOG_CANCEL_COOLDOWN_HOURS || '24' }}
      REF: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Restart dead chains
        run: bash src/common/watchdog.sh
