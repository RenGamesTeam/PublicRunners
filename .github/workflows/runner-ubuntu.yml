name: Ubuntu Runner

# Bootstraps a self-hosted, ephemeral Ubuntu runner for the organisation and
# keeps a successor run queued before this one ends.
#
# The run is intentionally not triggered by a schedule: the watchdog workflow
# (runner-watchdog.yml) restarts a chain that died, while a healthy chain
# dispatches its own successor. That keeps exactly one runner job alive without
# accumulating a queue of pending runs.
on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Runner loop duration in seconds (1-18000)"
        required: false
        default: "18000"
      poll_interval_seconds:
        description: "Monitor polling interval in seconds"
        required: false
        default: "120"
      retry_delay_seconds:
        description: "Delay before retrying after a failed runner job"
        required: false
        default: "600"
      chain_budget:
        description: "Number of successor runs still allowed (0 = unlimited)"
        required: false
        default: "0"
      runner_prefix:
        description: "Runner name prefix"
        required: false
        default: "pr-ubuntu"
      labels:
        description: "Runner labels"
        required: false
        default: "self-hosted,Linux,X64"
      dry_run:
        description: "Test mode: hold the runner job without registering a runner"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: public-runner-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  runner:
    name: runner
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CHAIN_ENABLED: ${{ vars.RUNNER_CHAIN_ENABLED || 'true' }}
      DRY_RUN: ${{ inputs.dry_run }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      ORG_NAME: ${{ github.repository_owner }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.TOKEN }}
      RUNNER_PREFIX: ${{ inputs.runner_prefix }}
      LABELS: ${{ inputs.labels }}
      # Keep the inner runner's job names out of this public run log.
      RUNNER_LOG_TO_STDOUT: ${{ vars.RUNNER_LOG_TO_STDOUT || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Clean up stale runners
        if: env.CHAIN_ENABLED != 'false' && env.DRY_RUN != 'true'
        # Best effort: a stale offline runner must never block the chain.
        continue-on-error: true
        run: bash src/common/remove_runner.sh --prefix "${RUNNER_PREFIX}-"

      - name: Run ephemeral runner loop
        if: env.CHAIN_ENABLED != 'false'
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: no runner will be registered; holding for ${DURATION_SECONDS}s"
            sleep "$DURATION_SECONDS"
            exit 0
          fi
          bash src/ubuntu/setup.sh
          bash src/ubuntu/run-loop.sh

      - name: Chain disabled
        if: env.CHAIN_ENABLED == 'false'
        run: echo "RUNNER_CHAIN_ENABLED is false; skipping the runner loop"

  monitor:
    name: monitor
    needs: runner
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JOB_NAME: runner
      WORKFLOW_FILE: runner-ubuntu.yml
      CHAIN_REF: ${{ github.ref_name }}
      CHAIN_ENABLED: ${{ vars.RUNNER_CHAIN_ENABLED || 'true' }}
      MAX_CONSECUTIVE_FAILURES: ${{ vars.MAX_CONSECUTIVE_FAILURES || '5' }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
      RETRY_DELAY_SECONDS: ${{ inputs.retry_delay_seconds }}
      CHAIN_BUDGET: ${{ inputs.chain_budget }}
      RUNNER_PREFIX: ${{ inputs.runner_prefix }}
      LABELS: ${{ inputs.labels }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Dispatch successor
        id: chain
        run: bash src/common/monitor.sh
