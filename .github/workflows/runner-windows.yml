name: Windows Runner

# Windows counterpart of runner-ubuntu.yml: bootstraps a self-hosted, ephemeral
# Windows runner and hands over to a successor run.
on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Runner loop duration in seconds (1-18000)"
        required: false
        default: "18000"
      poll_interval_seconds:
        description: "Monitor polling interval in seconds"
        required: false
        default: "120"
      retry_delay_seconds:
        description: "Delay before retrying after a failed runner job"
        required: false
        default: "600"
      chain_budget:
        description: "Number of successor runs still allowed (0 = unlimited)"
        required: false
        default: "0"
      runner_prefix:
        description: "Runner name prefix"
        required: false
        default: "pr-windows"
      labels:
        description: "Runner labels"
        required: false
        default: "self-hosted,Windows,X64"
      dry_run:
        description: "Test mode: hold the runner job without registering a runner"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: public-runner-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  runner:
    name: runner
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      CHAIN_ENABLED: ${{ vars.RUNNER_CHAIN_ENABLED || 'true' }}
      DRY_RUN: ${{ inputs.dry_run }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      ORG_NAME: ${{ github.repository_owner }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.TOKEN }}
      RUNNER_PREFIX: ${{ inputs.runner_prefix }}
      LABELS: ${{ inputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Clean up stale runners
        if: env.CHAIN_ENABLED != 'false' && env.DRY_RUN != 'true'
        # Best effort: a stale offline runner must never block the chain.
        # bash (Git for Windows) is available on the Windows images; using the
        # bash shell keeps `${RUNNER_PREFIX}` from being expanded by PowerShell.
        continue-on-error: true
        shell: bash
        run: bash src/common/remove_runner.sh --prefix "${RUNNER_PREFIX}-"

      - name: Run ephemeral runner loop
        if: env.CHAIN_ENABLED != 'false'
        shell: pwsh
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DRY_RUN -eq 'true') {
            Write-Host "Dry run: no runner will be registered; holding for $env:DURATION_SECONDS seconds"
            Start-Sleep -Seconds ([int]$env:DURATION_SECONDS)
            exit 0
          }
          # Both scripts throw on failure; with $ErrorActionPreference = 'Stop'
          # the step fails instead of silently continuing. Do not gate on
          # $LASTEXITCODE here: it is $null after a PowerShell script runs,
          # and `$null -ne 0` is true, which skipped run-loop.ps1 entirely.
          & "$env:GITHUB_WORKSPACE/src/windows/setup.ps1"
          & "$env:GITHUB_WORKSPACE/src/windows/run-loop.ps1"

      - name: Chain disabled
        if: env.CHAIN_ENABLED == 'false'
        shell: pwsh
        run: Write-Host 'RUNNER_CHAIN_ENABLED is false; skipping the runner loop'

  monitor:
    name: monitor
    needs: runner
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JOB_NAME: runner
      WORKFLOW_FILE: runner-windows.yml
      CHAIN_REF: ${{ github.ref_name }}
      CHAIN_ENABLED: ${{ vars.RUNNER_CHAIN_ENABLED || 'true' }}
      MAX_CONSECUTIVE_FAILURES: ${{ vars.MAX_CONSECUTIVE_FAILURES || '5' }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
      RETRY_DELAY_SECONDS: ${{ inputs.retry_delay_seconds }}
      CHAIN_BUDGET: ${{ inputs.chain_budget }}
      RUNNER_PREFIX: ${{ inputs.runner_prefix }}
      LABELS: ${{ inputs.labels }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Dispatch successor
        id: chain
        run: bash src/common/monitor.sh
